name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand, on any ref. Added after an Actions outage swallowed the trigger
  # for a pull request: GitHub created no run at all, and the web UI offers no retry
  # for a run that does not exist — so the only ways back were a fresh commit or
  # closing and reopening the PR. `workflow_dispatch` is usable from the Actions tab
  # and from `gh workflow run ci.yml --ref <branch>`, but ONLY once this file is on
  # the default branch, which is why it is worth having before the next outage.
  workflow_dispatch:

# A push on top of a push should not leave the older run burning a Windows
# runner for a commit nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Both legs block now. Windows was non-blocking while COD-7 left it red by
    # design; §1-§3 landed, it went 454 failures -> 0, and the flip was the stated
    # acceptance criterion for that phase. A job that stays advisory after it goes
    # green is how a team learns to ignore CI, which is the thing the original
    # exemption was avoiding in the other direction.
    #
    # The cost is real and worth knowing: the Windows leg is ~29m against ubuntu's
    # ~3m, so it is the critical path of every pull request. COD-14 has the
    # measurements and what is left to try.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
            oneCell: ''
          - os: windows-latest
            required: true
            # One cell of each combinatorial matrix instead of the cross-product.
            # The cross-product proves the FOLD picks the right winner, and the fold
            # is deterministic and platform-independent, so ubuntu proves it for
            # everyone; what a second platform adds is coverage of paths, temp dirs,
            # spawns and handles, which one cell exercises just as well. Measured:
            # 28,132 -> 24,062 spawns (-14.5%), and every Windows-only defect this
            # project has hit was plumbing, never fold semantics. See src/test-matrix.ts.
            oneCell: '1'
    env:
      # Empty on ubuntu, so `matrix()` returns every cell there.
      CODEMAP_ONE_CELL: ${{ matrix.oneCell }}
    steps:
      # BEFORE checkout: autocrlf is applied as files are written, so setting it
      # afterwards changes nothing. Hashing itself survives CRLF (`src/indexer.ts`
      # strips CR before tokenizing), but byte-exact fixtures do not — and CRLF is
      # what forced HASH_SCHEME 2 in the first place.
      - name: Leave line endings alone
        run: git config --global core.autocrlf false

      # `C:` is the Azure managed OS disk — high latency; `D:` is the VM's physically
      # local temp disk. The runner puts GITHUB_WORKSPACE on D: and leaves TEMP on C:,
      # so this suite writes thousands of small files — a store, a sidecar and several
      # git clones per test — to the slow one. pip made exactly this change and cut
      # their Windows CI by up to 30% (pypa/pip#13129); when GitHub moved RUNNER_TEMP
      # from D: to C: in June 2025, workflows slowed 40-50% (runner-images#12386).
      #
      # Node reads TEMP then TMP for `os.tmpdir()`, which is what every `mkdtempSync`
      # in the suite goes through, so setting both is enough.
      #
      # Guarded on D: existing, and it REPORTS what it did. There was a plan to drop
      # user-accessible D: from the Windows Server 2025 image (runner-images#12416);
      # our image still has it, but if that lands this must degrade to "leave TEMP
      # alone" rather than fail — and the log line is how the next person tells which
      # happened. The Defender step this replaces could not report whether it applied,
      # which is why its null result taught us nothing.
      - name: Put TEMP on the fast drive (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'D:\') {
            New-Item -ItemType Directory -Force -Path 'D:\t' | Out-Null
            "TEMP=D:\t" >> $env:GITHUB_ENV
            "TMP=D:\t"  >> $env:GITHUB_ENV
            Write-Host "TEMP moved to D:\t (was $env:TEMP)"
          } else {
            Write-Host "no D: drive on this image — TEMP left at $env:TEMP"
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The store uses node:sqlite (DatabaseSync) unflagged, which needs >=23.4.
          node-version: '24'
          cache: npm

      # `resolvePrincipal` (src/identity.ts) shells out to `git config user.email`,
      # and every write op refuses without one — a runner has no identity by default.
      # Deliberately not CODEMAP_PRINCIPAL: identity.test.ts unsets that env var in
      # order to test the git path, so setting it here would hide a real regression.
      - name: Give the runner an identity
        run: |
          git config --global user.email "ci@codemap.invalid"
          git config --global user.name "codemap CI"

      - run: npm ci

      # Through the npm script, never `node --test` directly: --test-isolation=none
      # and --test-concurrency=1 are load-bearing. Isolation because the runner's
      # per-file child intermittently never exits (see CLAUDE.md § "The stall"),
      # concurrency because a few tests set CODEMAP_AGENT_MODEL around a call.
      # `unit` typechecks src and web/ on the way in.
      - run: npm run unit

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Every prerequisite this suite needs lives OUTSIDE the repo, by the golden
      # rule — the test tree may not add a runtime dependency, and `npm test` must
      # never depend on a browser being installed. So CI supplies them the same way
      # a developer machine does: from somewhere else, named by an env var.
      CODEMAP_VDX_TOOLS: ${{ github.workspace }}/../vdx-web/tools
      CODEMAP_E2E_PLAYWRIGHT: ${{ github.workspace }}/../browsers
      CODEMAP_E2E_PUPPETEER: ${{ github.workspace }}/../browsers
      CODEMAP_E2E_GIT_REPO: ${{ github.workspace }}/../jellyfin
      # CODEMAP_E2E_CHROMIUM is deliberately NOT declared here. puppeteer's launch
      # sets `executablePath` unconditionally (harness.ts:171) — unlike playwright's,
      # which only sets it when the path exists — so both drivers share the one
      # chromium playwright installs, which is what the harness comment already asks
      # for. Its path is only known after that install, so the browser step writes it
      # to $GITHUB_ENV. A job-level `env` entry would OUTRANK that write and pin it to
      # whatever was declared, which for an empty string means puppeteer launches with
      # `executablePath: ''` and fails instead of skipping.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Give the runner an identity
        run: |
          git config --global user.email "ci@codemap.invalid"
          git config --global user.name "codemap CI"

      - run: npm ci

      # Zero install: vdx-web has no package.json and no dependencies — `tools/`
      # is plain Node against the stdlib. A shallow clone is the whole cost.
      - name: vdx tools (for the template lint)
        run: git clone --quiet --depth 1 https://github.com/iwalton3/vdx-web.git "$GITHUB_WORKSPACE/../vdx-web"

      # Installed into a throwaway directory OUTSIDE the repo, never into
      # package.json: `resolvePuppeteer`/`resolvePlaywright` take a directory and
      # `createRequire` from it, precisely so a browser driver stays something the
      # machine has rather than something this repo pulls in.
      #
      # PUPPETEER_SKIP_DOWNLOAD avoids a second ~170MB Chrome — it drives the
      # chromium playwright installs, via CODEMAP_E2E_CHROMIUM.
      - name: Browser drivers, outside the project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../browsers"
          cd "$GITHUB_WORKSPACE/../browsers"
          npm init -y > /dev/null
          PUPPETEER_SKIP_DOWNLOAD=true npm install --silent playwright puppeteer
          npx playwright install --with-deps chromium
          echo "CODEMAP_E2E_CHROMIUM=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"

      # Keyed on real-repo.ts, so the cache follows the fixture definition: a
      # merged PR's baseRefOid/headRefOid are immutable, so this never rots on its
      # own, but editing the fixture invalidates it exactly when it should.
      - name: Cache the jellyfin fixture
        id: jellyfin-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../jellyfin
          key: jellyfin-${{ hashFiles('src/e2e/real-repo.ts') }}

      # Two steps, and the second is not optional. A clone brings branches and
      # tags, NEVER pull refs — and since PR resolution is git-only, the pull ref
      # is the actual prerequisite. `--no-checkout` because every test works on a
      # `--local` clone of this and never on the checkout (~97MB, no worktree).
      - name: Fetch the jellyfin fixture
        if: steps.jellyfin-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --no-checkout https://github.com/jellyfin/jellyfin.git "$GITHUB_WORKSPACE/../jellyfin"
          git -C "$GITHUB_WORKSPACE/../jellyfin" fetch --quiet origin '+refs/pull/17463/head:refs/pull/17463/head'

      # With the four prerequisites above supplied, this suite runs in full rather
      # than skipping. Each one still degrades to a SKIP if its step fails or is
      # removed, which CLAUDE.md requires and nothing else checks.
      - run: npm run e2e
