<title>Reconsolidation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one reading column; a sticky tally; one card per cluster, marks first, cases three-across. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1b1f27; --muted:#5d6472; --line:#dadde3;
  --accent:#2f5a8f; --accent-soft:#e2eaf5;
  --owner:#1b1f27; --session:#6a7180;
  --principle:#2f5a8f; --business:#8a5a12; --uncertain:#6b5a86; --oneoff:#5d6472; --nosurprise:#9b3b33; --discuss:#2e7466; --doc:#3d6b46; --tabled:#7a6a2c;
  --principle-bg:#e2eaf5; --business-bg:#f6ecda; --uncertain-bg:#ece7f3; --oneoff-bg:#eceef1; --nosurprise-bg:#f6e3e1; --discuss-bg:#dff0ec; --doc-bg:#e3f0e5; --tabled-bg:#f2eed9;
  --display:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --voice:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --panel:#1a1e26; --ink:#e6e8ec; --muted:#9aa1ae; --line:#2c323d;
  --accent:#8db3e6; --accent-soft:#1f2b3d; --owner:#eef0f3; --session:#8f96a3;
  --principle:#8db3e6; --business:#e2b46a; --uncertain:#b9a6d9; --oneoff:#a4abb7; --nosurprise:#ee8f86; --discuss:#7fcbb9; --doc:#8fc79a; --tabled:#d8c479;
  --principle-bg:#1f2b3d; --business-bg:#342917; --uncertain-bg:#2a2436; --oneoff-bg:#23272f; --nosurprise-bg:#3a2120; --discuss-bg:#17312c; --doc-bg:#1b2e20; --tabled-bg:#2f2a15;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --ink:#e6e8ec; --muted:#9aa1ae; --line:#2c323d;
  --accent:#8db3e6; --accent-soft:#1f2b3d; --owner:#eef0f3; --session:#8f96a3;
  --principle:#8db3e6; --business:#e2b46a; --uncertain:#b9a6d9; --oneoff:#a4abb7; --nosurprise:#ee8f86; --discuss:#7fcbb9; --doc:#8fc79a; --tabled:#d8c479;
  --principle-bg:#1f2b3d; --business-bg:#342917; --uncertain-bg:#2a2436; --oneoff-bg:#23272f; --nosurprise-bg:#3a2120; --discuss-bg:#17312c; --doc-bg:#1b2e20; --tabled-bg:#2f2a15;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:24px 72px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font:600 30px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 20px/1.25 var(--display);margin:0;text-wrap:balance}
h3{font:600 13px/1.3 var(--display);margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.sub{color:var(--muted);max-width:70ch}
code,.mono{font-family:var(--mono);font-size:.82em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .status{margin-left:auto;color:var(--muted)}
.pill{padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;font-variant-numeric:tabular-nums}
.stat b{display:block;font:600 24px/1.1 var(--display)}
.stat span{color:var(--muted);font-size:13px}
section{display:flex;flex-direction:column;gap:14px}
.topic{border-top:2px solid var(--ink);padding-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card[data-mark="principle"]{border-left-color:var(--principle)}
.card[data-mark="business"]{border-left-color:var(--business)}
.card[data-mark="oneoff"]{border-left-color:var(--oneoff)}
.card[data-mark="nosurprise"]{border-left-color:var(--nosurprise)}
.card[data-mark="discuss"]{border-left-color:var(--discuss)}
.card[data-mark="doc"]{border-left-color:var(--doc)}
.card[data-mark="tabled"]{border-left-color:var(--tabled)}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.id{font:400 12px var(--mono);color:var(--muted)}
.title{font:600 17px/1.3 var(--display)}
.set{font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:1px 7px;border-radius:4px;border:1px solid currentColor}
.set-business{color:var(--business)} .set-principle{color:var(--principle)} .set-uncertain{color:var(--uncertain)} .set-doc{color:var(--doc)}
.count{font-size:12px;color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.marks button{font:500 13px var(--body);padding:5px 11px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.marks button:hover{border-color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.marks button[aria-pressed="true"]{font-weight:600}
.marks button[aria-pressed="true"][data-v="principle"]{background:var(--principle-bg);border-color:var(--principle);color:var(--principle)}
.marks button[aria-pressed="true"][data-v="business"]{background:var(--business-bg);border-color:var(--business);color:var(--business)}
.marks button[aria-pressed="true"][data-v="oneoff"]{background:var(--oneoff-bg);border-color:var(--oneoff);color:var(--oneoff)}
.marks button[aria-pressed="true"][data-v="nosurprise"]{background:var(--nosurprise-bg);border-color:var(--nosurprise);color:var(--nosurprise)}
.marks button[aria-pressed="true"][data-v="discuss"]{background:var(--discuss-bg);border-color:var(--discuss);color:var(--discuss)}
.marks button[aria-pressed="true"][data-v="doc"]{background:var(--doc-bg);border-color:var(--doc);color:var(--doc)}
.marks button[aria-pressed="true"][data-v="tabled"]{background:var(--tabled-bg);border-color:var(--tabled);color:var(--tabled)}
.marks button[aria-pressed="true"][data-v="ratified"],.marks button[aria-pressed="true"][data-v="provisional"]{background:var(--business-bg);border-color:var(--business);color:var(--business)}
label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
textarea{width:100%;min-height:44px;resize:vertical;font:15px/1.45 var(--voice);color:var(--owner);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.words textarea{min-height:64px}
.extra{padding:10px 12px;border-radius:5px;background:var(--bg)}
.biz{display:flex;flex-direction:column;gap:10px;padding:10px 12px;border-radius:5px;background:var(--business-bg)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px;font-size:13px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.cases{display:flex;flex-direction:column;gap:10px}
.case{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px 16px;padding-top:10px;border-top:1px solid var(--line)}
.case > div{min-width:0}
.case h4{margin:0 0 3px;font:500 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.case .situation{font-size:14px}
.case .expected{font-size:14px;color:var(--session)}
.case .said{font:15px/1.5 var(--voice);color:var(--owner)}
.case .said q{quotes:"\201C" "\201D"}
.case .meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.case .meta .mono{overflow-wrap:anywhere}
.written{font:15px/1.5 var(--voice);border-left:3px solid var(--nosurprise);padding-left:10px}
.empty{color:var(--muted);font-style:italic}
details.aside{border-top:1px solid var(--line);padding-top:12px}
details.aside summary{cursor:pointer;font:600 17px/1.3 var(--display)}
details.aside[open] summary{margin-bottom:12px}
.aside-why{font-size:13px;color:var(--muted)}
.aside-why b{color:var(--ink)}
.offline{color:var(--nosurprise)}
@media (max-width:720px){.case{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 id="h1">Reconsolidation</h1>
    <p class="sub" id="lede">Your answers that the rules and principles did not predict, grouped by what you did. Mark each cluster, and if it should be kept, write it in your own words. Nothing is written back without your words. Marks save as you go.</p>
  </header>
  <div class="bar"><span class="pill" id="tally">Loading…</span><span class="status" id="status">Connecting…</span></div>
  <div class="stats" id="stats"></div>
  <main id="main" class="wrap" style="gap:34px"></main>
</div>

<script>
const MARKS = [["principle","Principle"],["business","Business rule"],["doc","Goes in a doc"],["tabled","Table for later"],["oneoff","One-off"],["nosurprise","Not a surprise"],["discuss","Discuss"]];
const SET_LABEL = {business:"Probable business rule", principle:"Probable principle", doc:"Probable doc material", uncertain:"Uncertain"};
const SET_ORDER = ["business","principle","doc","uncertain"];
const state = {};          // id -> {mark, words, reason, status, falsifier, distinguish}
const ids = [];
let db = null;
const chains = {};         // one write at a time per document
// id -> {field: write}: set here and not yet saved. A snapshot keeps these fields' local values,
// or one sent before the write lands would undo it on screen and in the next write's body.
const dirty = {};
let writes = 0;

const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function markButtons(id, options, field){
  const g = $("div","marks"); g.setAttribute("role","group");
  for (const [v,label] of options){
    const b = $("button",null,label); b.type = "button"; b.dataset.v = v; b.dataset.field = field; b.setAttribute("aria-pressed","false");
    b.addEventListener("click", () => setField(id, field, state[id]?.[field] === v ? null : v));
    g.appendChild(b);
  }
  return g;
}
function box(id, field, labelText, cls){
  const w = $("div", cls || null);
  const l = $("label", null, labelText); l.htmlFor = `f-${id}-${field}`;
  const t = $("textarea"); t.id = `f-${id}-${field}`; t.dataset.field = field; t.rows = 2;
  let timer;
  t.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => setField(id, field, t.value), 700); });
  t.addEventListener("blur", () => { clearTimeout(timer); setField(id, field, t.value); });
  w.append(l, t); return w;
}
function caseRow(c){
  const r = $("div","case");
  const s = $("div"); s.append($("h4",null,"Situation"), $("p","situation",c.situation||""));
  const e = $("div"); e.append($("h4",null,"Session expected"), $("p","expected",c.expected||""));
  const o = $("div"); const q = $("q"); q.textContent = c.said||""; const p = $("p","said"); p.appendChild(q);
  o.append($("h4",null,`${c.who||"Owner"} said`), p);
  const m = $("div","meta"); m.append($("span",null,c.date||""), $("span","mono",c.cite||""));
  r.append(s,e,o,m); return r;
}
function clusterCard(c, kind){
  ids.push(c.id);
  const card = $("article","card"); card.id = "card-"+c.id;
  const head = $("div","head");
  head.append($("span","id",c.id), $("span","title",c.title||""));
  if (c.set) head.append($("span",`set set-${c.set}`,SET_LABEL[c.set]||c.set));
  if (c.cases) head.append($("span","count",`${c.cases.length} cases`));
  card.appendChild(head);
  card.appendChild(markButtons(c.id, MARKS, "mark"));
  card.appendChild(box(c.id,"words","In your words","words"));
  const biz = $("div","biz"); biz.hidden = true; biz.dataset.role = "biz";
  biz.append(box(c.id,"reason","Reason (a business rule needs one)"));
  const st = $("div"); st.append($("label",null,"Status"), markButtons(c.id, [["ratified","Ratified"],["provisional","Provisional"]], "status"));
  biz.append(st);
  const fal = box(c.id,"falsifier","Falsifier: what would make it stop applying (ratified rules have one too)"); fal.dataset.role = "fal";
  biz.append(fal);
  card.appendChild(biz);
  const same = box(c.id,"mergeWith","Same as: other clusters, or a principle or rule already written (optional)","extra"); same.dataset.role = "same"; same.hidden = true; card.appendChild(same);
  const doc = box(c.id,"doc","Which doc","extra"); doc.dataset.role = "doc"; doc.hidden = true; card.appendChild(doc);
  const tab = box(c.id,"holder","Who holds it","extra"); tab.dataset.role = "tab"; tab.hidden = true; card.appendChild(tab);
  if (c.reason || c.useful){
    const why = $("div","why");
    if (c.reason){ const d = $("div"); d.append($("b",null,"Why this set. "), document.createTextNode(c.reason)); why.appendChild(d); }
    if (c.useful){ const d = $("div"); d.append($("b",null,"Useful? "), document.createTextNode(c.useful)); why.appendChild(d); }
    card.appendChild(why);
  }
  const cases = $("div","cases");
  for (const x of (c.cases || [c])) cases.appendChild(caseRow(x));
  card.appendChild(cases);
  return card;
}
function contradictionCard(x){
  ids.push(x.id);
  const card = $("article","card"); card.id = "card-"+x.id;
  const head = $("div","head"); head.append($("span","id",x.id), $("span","title","Against something already written"));
  card.append(head);
  card.append(markButtons(x.id, [["discuss","Discuss"],["nosurprise","Not a surprise"]], "mark"));
  card.append(box(x.id,"distinguish","What distinguishes these?","words"));
  const w = $("div"); w.append($("h3",null,"Written"), $("p","written",x.written||""), $("p","count mono",x.writtenAt||""));
  card.append(w);
  const cases = $("div","cases"); cases.appendChild(caseRow(x.case||{})); card.append(cases);
  return card;
}
function render(d){
  document.getElementById("h1").textContent = `Reconsolidation, ${d.run||""}`;
  const k = d.counts || {};
  const stats = document.getElementById("stats");
  const stat = (v,l) => { const s = $("div","stat"); s.append($("b",null,String(v ?? "–")), $("span",null,l)); stats.appendChild(s); };
  stat(k.answers,"answers in scope"); stat(k.explainedByRule,"explained by a rule"); stat(k.explainedByRecommendation,"matched the recommendation");
  stat(k.residuals,"residuals"); stat(k.rate,"residual rate"); stat(k.previousRate ?? "first run","last run's rate");
  if (d.scope){ const p = $("p","sub",d.scope); stats.after(p); }
  const main = document.getElementById("main");
  if (d.contradictions?.length){
    const s = $("section"); s.append($("h2",null,"Against something already written"), $("p","sub","Each of these disagrees with a rule or principle as written today. Say what distinguishes them; they don't become new entries."));
    d.contradictions.forEach(x => s.appendChild(contradictionCard(x))); main.appendChild(s);
  }
  const all = (d.clusters || []).concat((d.singletons || []).filter(x => x.aside));
  const clusters = (d.clusters || []).filter(c => !c.aside);
  const topics = (d.topics && d.topics.length) ? d.topics : [null];
  for (const t of topics){
    const inTopic = clusters.filter(c => t === null ? true : c.topic === t);
    if (!inTopic.length) continue;
    const s = $("section", t ? "topic" : null);
    if (t) s.append($("h2",null,t));
    for (const set of SET_ORDER){
      const group = inTopic.filter(c => c.set === set);
      if (!group.length) continue;
      s.append($("h3",null,`${SET_LABEL[set]} · ${group.length}`));
      group.forEach(c => s.appendChild(clusterCard(c)));
    }
    main.appendChild(s);
  }
  const stray = clusters.filter(c => d.topics?.length && !d.topics.includes(c.topic));
  if (stray.length){ const s = $("section"); s.append($("h2",null,"Other")); stray.forEach(c => s.appendChild(clusterCard(c))); main.appendChild(s); }
  const singles = (d.singletons || []).filter(x => !x.aside);
  if (singles.length){
    const s = $("section"); s.append($("h2",null,`Singletons · ${singles.length}`), $("p","sub","One case each. Usually one-offs; mark any that deserve words."));
    singles.forEach(x => s.appendChild(clusterCard(x))); main.appendChild(s);
  }
  const aside = all.filter(x => x.aside);
  if (aside.length){
    const det = $("details","aside"); det.append($("summary",null,`Set aside by Claude · ${aside.length}`));
    det.append($("p","sub","Judged not to need your attention, each with the reason. Mark any you disagree with and it counts like the rest."));
    for (const x of aside){
      const card = clusterCard(x);
      const why = $("p","aside-why"); why.append($("b",null,"Set aside: "), document.createTextNode(x.aside));
      card.insertBefore(why, card.children[1]);
      det.appendChild(card);
    }
    main.appendChild(det);
  }
  ids.forEach(paint); tally();
}
function paint(id){
  const card = document.getElementById("card-"+id); if (!card) return;
  const st = state[id] || {};
  card.dataset.mark = st.mark || "";
  card.querySelectorAll(".marks button").forEach(b => b.setAttribute("aria-pressed", String(st[b.dataset.field] === b.dataset.v)));
  card.querySelectorAll("textarea").forEach(t => { if (document.activeElement !== t) t.value = st[t.dataset.field] || ""; });
  const biz = card.querySelector('[data-role="biz"]'); if (biz) biz.hidden = st.mark !== "business";
  const same = card.querySelector('[data-role="same"]'); if (same) same.hidden = !(st.mark === "principle" || st.mark === "business");
  const doc = card.querySelector('[data-role="doc"]'); if (doc) doc.hidden = st.mark !== "doc";
  const tab = card.querySelector('[data-role="tab"]'); if (tab) tab.hidden = st.mark !== "tabled";
}
function tally(){
  const n = ids.length; let marked = 0, worded = 0;
  for (const id of ids){ if (state[id]?.mark) marked++; if ((state[id]?.words||state[id]?.distinguish||"").trim()) worded++; }
  document.getElementById("tally").textContent = `${marked} of ${n} marked · ${worded} in your words`;
}
function status(msg, bad){ const s = document.getElementById("status"); s.textContent = msg; s.className = "status" + (bad ? " offline" : ""); }
function setField(id, field, value){
  const cur = state[id] || {}; if ((cur[field] ?? null) === (value ?? null)) return;
  state[id] = {...cur, [field]: value}; paint(id); tally();
  const n = ++writes; (dirty[id] ||= {})[field] = n;
  save(id)?.then(ok => { if (ok && dirty[id][field] === n) delete dirty[id][field]; });
}
function save(id){
  if (!db){ status("Not saved: this view can't store marks", true); return; }
  const body = {...state[id], at: new Date().toISOString()};
  return chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("marks/"+id).set(body))
    .then(() => { status("Saved"); return true; }, e => { status("Save failed: " + (e?.code || "error"), true); return false; });
}
(async () => {
  let data;
  try { const r = await fetch("clusters.json"); if (!r.ok) throw new Error(r.status); data = await r.json(); }
  catch(e){ document.getElementById("main").appendChild($("p","empty","The clusters file didn't load, so there is nothing to mark yet.")); status("No data", true); return; }
  render(data);
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db){ status("Read-only here: marks will not save", true); return; }
  status("Saves as you mark");
  db.collection("marks").onSnapshot(snap => {
    for (const d of snap.docs){ const b = d.data(); if (!b) continue; const {at, ...rest} = b;
      for (const f in dirty[d.id]) rest[f] = state[d.id]?.[f];
      state[d.id] = rest; paint(d.id); }
    tally();
  }, e => status("Live sync stopped: " + (e?.code || "error"), true));
})();
</script>
