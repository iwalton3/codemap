<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codemap</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --border: #2a313c;
      --text: #d7dde5; --dim: #8b95a3; --accent: #58a6ff; --accent2: #7ee787;
      --warn: #f0a35e; --bad: #f27b7b; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      --hdr-h: 49px; /* global sticky <header> height — offset for sticky section headers */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    codemap-app { display: block; min-height: 100vh; }
    /* Themed base for any button without a container-specific rule (container rules
       win on specificity). Keeps ad-hoc buttons from falling back to browser white. */
    /* Converted navigation carries its row's class, which sets everything; without this
       the UA blue-underline shows through. The `target` rule keeps the EXTERNAL links
       (GitHub) visible — they have no class of their own and relied on UA styling. */
    a { color: inherit; text-decoration: none; cursor: pointer; }
    a[target="_blank"] { color: var(--accent); }
    /* A link that should read as a button — an <a> because it navigates, so it can be
       middle-clicked, but it sits among buttons and must not look foreign. */
    .btnlike { display: inline-block; }
    button, .btnlike { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; font-family: inherit; }
    button:hover { border-color: var(--dim); }
    /* Form controls get a BASE, the way `button` above always has.
       Every other input in this file is dressed by an enclosing class (`.op-edit input`,
       `.cmt-new input`, …), which works right up to the first input whose container has no
       rule — and that one renders as a white box in a dark app with nothing to say so. Two
       shipped that way. A bare `input` selector is specificity 0,0,1, so every existing
       rule still wins; this only catches what nothing else claims. */
    input, textarea, select { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; font-size: 13px; font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--dim); }

    header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    /* `nowrap` + `flex-shrink: 0` on the brand: without it the wordmark wraps to three
       lines at ~720px and takes the whole header with it — which is most of what the
       "menus overflow" report actually was. The subtitle is the part that goes. */
    .brand { font-weight: 700; letter-spacing: 0.5px; color: var(--accent2); white-space: nowrap; flex: 0 0 auto; }
    .uni { display: flex; gap: 6px; }
    .uni button, .uni a { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    .uni button.active, .uni a.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .uni button .n, .uni a .n { opacity: 0.7; font-size: 11px; margin-left: 5px; }
    /* The pull button renders AFTER `.search`, which keeps `margin-left: auto`. Moving
       the auto onto the button instead would have left the search box unanchored on a
       universe with no sidecar, where the button is not rendered at all. */
    .pullbtn { background: var(--panel2); color: var(--dim); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .pullbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .pullbtn:disabled { opacity: 0.6; cursor: default; }
    .pullnote { color: var(--dim); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* `min-width: 0` is what lets it actually shrink — a flex item's floor is its
       content width otherwise, so a 240px input pushed itself off the right edge
       instead of narrowing. */
    .search { margin-left: auto; min-width: 0; flex: 0 1 auto; }
    .search input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; width: 240px; max-width: 100%; font-size: 13px; }
    .uni { flex: 0 0 auto; }

    /* Half of a 1440p display, beside an editor. The wordmark's subtitle and the
       search placeholder are the first things that stop earning their width. */
    @media (max-width: 900px) {
      header { gap: 10px; padding: 10px 12px; }
      .search input { width: 150px; }
    }

    main { padding: 16px 18px; max-width: 1100px; margin: 0 auto; }
    /* Graph pages use the full window width + viewport height for legibility. */
    main.wide { max-width: none; }
    .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 12px; font-family: var(--mono); font-size: 13px; }
    .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .crumbs .sep { color: var(--dim); }

    .rows { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .row { display: grid; grid-template-columns: 24px 1fr 96px 78px 62px 58px; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); cursor: pointer; }

    /* review heat: two stacked tracks (logical over code) */
    .rheat { display: inline-flex; flex-direction: column; gap: 2px; width: 78px; }
    .rheat.empty { visibility: hidden; }
    .rtrack { display: flex; height: 5px; border-radius: 3px; background: #20262f; overflow: hidden; }
    .rtrack i.done { background: var(--accent2); }
    .rtrack i.stale { background: var(--warn); }
    .rlegend { display: inline-flex; gap: 14px; font-size: 11.5px; color: var(--dim); margin: 0 0 10px 2px; }
    .rlegend .k { display: inline-flex; align-items: center; gap: 5px; }
    .rlegend .mini { width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent2) 60%, #20262f 60%); }
    .rdots { display: inline-flex; gap: 4px; margin-left: 8px; }
    .rdots .rd { width: 7px; height: 7px; border-radius: 2px; background: #3a4250; }
    .rdots .rd.done { background: var(--accent2); } .rdots .rd.checked { background: var(--accent); } .rdots .rd.stale { background: var(--warn); }
    .row:first-child { border-top: none; }
    .row:hover { background: var(--panel); }
    .row .name { font-family: var(--mono); }
    .row .name.file { color: var(--text); }
    .row .name.dir { color: var(--accent); }
    .ico { font-size: 13px; color: var(--dim); text-align: center; }
    .bar { height: 6px; border-radius: 3px; background: #20262f; overflow: hidden; position: relative; }
    .bar > i { display: block; height: 100%; }
    /* The part of the documented bar that is only SWEPT IN by a `cover` selector,
       not cited by any doc — hatched, so a bar that reads 100% because everything
       was covered can't be mistaken for one where everything is described. */
    .bar > b.swept { position: absolute; top: 0; height: 100%;
      background: repeating-linear-gradient(45deg, rgba(0,0,0,.55) 0 2px, transparent 2px 5px); }
    .muted { color: var(--dim); font-size: 12px; text-align: right; }
    .tag { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }

    .sym { display: grid; grid-template-columns: 90px 1fr 90px; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--border); cursor: pointer; align-items: center; font-family: var(--mono); font-size: 13px; }
    .sym:first-child { border-top: none; }
    .sym:hover { background: var(--panel); }
    .sym .k { color: var(--dim); font-size: 11px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3a4250; margin-right: 6px; }
    .dot.on { background: var(--accent2); }

    .detail { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 16px; }
    .detail h2 { font-size: 16px; font-family: var(--mono); }
    .detail .meta { color: var(--dim); font-size: 12px; margin: 4px 0 12px; font-family: var(--mono); }
    pre.code { background: #0b0e13; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: #c9d4e2; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    .sec { margin-top: 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }
    .back { color: var(--accent); cursor: pointer; font-size: 13px; }
    .empty { color: var(--dim); padding: 24px; text-align: center; }
    .loading { color: var(--dim); padding: 24px; text-align: center; }

    /* rendered markdown */
    .md { line-height: 1.6; }
    .md > *:first-child { margin-top: 0; }
    .md h1, .md h2, .md h3 { margin: 14px 0 6px; line-height: 1.3; }
    .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
    .md p { margin: 8px 0; }
    .md ul, .md ol { margin: 8px 0 8px 22px; }
    .md li { margin: 3px 0; }
    .md a { color: var(--accent); }
    .md code { background: #0b0e13; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
    .md pre { background: #0b0e13; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding-left: 12px; color: var(--dim); }
    .detail h2 + .md { margin-top: 6px; }

    svg.graph { width: 100%; height: auto; background: #0b0e13; border: 1px solid var(--border); border-radius: 8px; }
    svg.graph g[data-id] { cursor: pointer; }
    svg.graph g[data-id]:hover rect { fill: var(--panel2); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--dim); }
    .legend .k { display: inline-flex; align-items: center; gap: 5px; }
    .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
    .viewlink { color: var(--accent); cursor: pointer; font-size: 13px; margin-left: 10px; }
    /* Grouped nav. The header is one flex row and it OVERFLOWED at ~720px wide — a
       tiled half of a 1440p display — so the graph views and the standard live behind
       a <details>, which needs no state and no lifecycle hook to open and close. */
    .vmenu { position: relative; }
    .vmenu > summary { list-style: none; color: var(--accent); cursor: pointer; font-size: 13px; margin-left: 10px; white-space: nowrap; }
    .vmenu > summary::-webkit-details-marker { display: none; }
    .vmenu[open] > summary { color: var(--accent2); }
    .vmenu-panel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; display: flex; flex-direction: column; gap: 2px;
      min-width: 150px; padding: 6px 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    .vmenu-panel .viewlink { margin-left: 0; padding: 5px 10px; border-radius: 5px; }
    .vmenu-panel .viewlink:hover { background: var(--panel2); }

    /* review + flow walker */
    .rev { display: inline-flex; gap: 6px; }
    .rev button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; font-family: inherit; }
    .rev button:hover { border-color: var(--dim); }
    .rev button.on { border-color: var(--accent2); color: var(--accent2); background: rgba(126,231,135,0.08); }
    .rev button.checked { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }
    .nrev button.checked { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }
    .rev button.stale { border-color: var(--warn); color: var(--warn); background: rgba(240,163,94,0.08); }
    .flow-step { border: 1px solid var(--border); border-radius: 10px; margin: 14px 0; }
    .flow-step > .shead { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--panel); border-radius: 10px 10px 0 0; }
    .flow-step .num { width: 26px; height: 26px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--dim); flex: none; }
    .flow-step .stitle { font-weight: 600; }
    .flow-step .shead .rev { margin-left: auto; }
    .flow-step .sbody { padding: 4px 14px 12px; }
    .anchor-code .sym { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin: 12px 0 4px; padding: 4px 6px; background: var(--bg); position: sticky; top: var(--hdr-h); z-index: 3; }
    .anchor-code .sym .rev { margin-left: auto; }
    pre.hljs, .hljs { background: #0b0e13 !important; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12.5px; line-height: 1.5; overflow-x: auto; margin: 0; font-family: var(--mono); }
    /* `display: block` is load-bearing: this is an <a>, and an inline box wrapping the
       block children below collapses the card. It was a <div on-click> until the
       real-links sweep (23f4876) and nothing here had to say so before. */
    .flow-card { display: block; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0; cursor: pointer; }
    .flow-card:hover { background: var(--panel); }
    /* The standard. `display: block` on the card for the same reason `.flow-card`
       carries it — these are anchors wrapping block children. */
    .spec-card { display: block; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0; cursor: pointer; }
    .spec-card:hover { background: var(--panel); }
    .spec-card .ft { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .spec-card .ft .n { color: var(--dim); font-size: 12px; }
    .spec-card .fs { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
    .op-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
    .op-card.moved { border-color: var(--warn); }
    .op-card .ft { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .op-card .fs { font-size: 12.5px; margin-top: 4px; }
    .op-card .fs.dim, .op-card .dim { color: var(--dim); }
    /* Author-written prose keeps its paragraphs. Scoped to `.prose` rather than put on
       `.fs`, which also dresses the `label.fs` wrappers — pre-wrap there would render the
       template's own indentation. `.cmt-b` beside this has always had it. */
    .op-card .fs.prose, .op-card .op-after.prose { white-space: pre-wrap; }
    /* The standard's own shape: Area, then Topic, then the rules filed under it. The
       hierarchy is in `section` (a `/`-delimited path) and was never rendered. */
    .op-area { margin-top: 22px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .op-area .n { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 8px; }
    .op-topic { margin-top: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }
    /* The disclosure control: chevron + the operation's name. It is the ONLY click target
       on the card, so it must contain nothing interactive — see `pick`. */
    .op-head { font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex;
      align-items: baseline; gap: 6px; border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
    .op-head:hover { background: var(--panel2); color: var(--accent); }
    .op-head .chev { color: var(--dim); font-size: 11px; }
    /* A criterion files under the rule it tests — `targetOperationId`. The indent says so. */
    .op-card.crit { margin-left: 26px; background: var(--panel); border-left: 2px solid var(--accent); }
    /* A rule's own acts live on its header row — two full rows per card, reclaimed. */
    .ftgap { flex: 1 1 auto; }
    .qbadge.ok { border-color: var(--accent2); color: var(--accent2); }
    .qbadge.mute { border-color: var(--border); color: var(--dim); }
    .op-group .op-card.sel { border-color: var(--accent); }
    .op-group .op-card .ft button { padding: 2px 8px; font-size: 11.5px; }
    .op-detail { margin-top: 4px; }
    /* A refusal from a fire-and-reload POST. Outside the render tree on purpose — it has to
       survive the reload that follows the click. See `flashError`. */
    #flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50;
      max-width: min(680px, 92vw); background: var(--panel); color: var(--text); cursor: pointer;
      border: 1px solid var(--bad); border-left: 3px solid var(--bad); border-radius: 8px;
      padding: 10px 14px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    /* A proposed detector: visible to the ratifier, and marked as NOT part of the signature. */
    .op-detector { margin-top: 6px; padding: 6px 9px; border-radius: 6px; background: var(--panel2);
      border-left: 2px solid var(--warn); }
    .op-card .fs.mono { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
    .op-card.crit .op-head { font-weight: 400; }
    .op-before, .op-after { font-size: 12.5px; margin-top: 5px; padding: 5px 9px; border-radius: 6px; background: var(--panel2); }
    .op-before { text-decoration: line-through; color: var(--dim); }
    .op-after { border-left: 2px solid var(--accent); }
    .op-move { margin-top: 6px; padding: 6px 9px; border-radius: 6px; background: var(--panel2); }
    .op-moverow { font-size: 12px; color: var(--dim); font-family: var(--mono); margin-top: 2px; }
    .op-blocked { font-size: 12px; color: var(--warn); margin-top: 3px; }
    .op-gap { margin-top: 6px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--warn); color: var(--warn); font-size: 12.5px; }
    .op-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    /* Correcting a draft is AUTHORING it; ratify/withdraw is disposing of it. Two rows,
       two classes, so a selector aimed at one can never pick up the other. */
    .op-edit { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .op-edit input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 13px; min-width: 220px; }
    .op-card label.fs, .op-move label.fs { display: block; margin-top: 6px; }
    .op-card label.fs input, .op-card label.fs textarea,
    .op-move label.fs input, .op-move label.fs textarea {
      display: block; width: 100%; box-sizing: border-box; margin-top: 3px;
      background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 5px 10px; font-size: 12.5px; font-family: inherit;
    }
    .cmts { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
    .cmt { margin-top: 6px; padding: 6px 9px; border-radius: 6px; background: var(--panel2); }
    .cmt-h { font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cmt-b { font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; }
    .cmt-a { font-size: 12px; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--border); }
    .cmt-new { display: flex; gap: 8px; margin-top: 8px; }
    .cmt-new input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; }
    .op-actions input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 13px; min-width: 220px; }
    .flow-card .ft { display: flex; align-items: baseline; gap: 10px; }
    .flow-card .ft .n { color: var(--dim); font-size: 12px; }
    .flow-card .fs { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
    .progress { display: inline-flex; gap: 10px; font-size: 12px; color: var(--dim); margin-top: 6px; }
    .rev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    /* --- node catalog --- */
    .nfilters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .nfilters input, .nfilters select { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; }
    .nfilters input { min-width: 180px; }
    .ncount { color: var(--dim); font-size: 12px; margin: 0 0 8px 2px; }
    .ngroup { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .ngh { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel); font-weight: 600; font-size: 13px; }
    .ngh .n { color: var(--dim); font-weight: 400; font-size: 12px; }
    .ngh .gdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .nrow { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--border); cursor: pointer; }
    .nrow:hover { background: var(--panel); }
    .nt { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid; color: var(--text); flex: none; opacity: 0.85; }
    .ntitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ndom { color: var(--dim); font-size: 11.5px; font-family: var(--mono); flex: none; }
    .nmeta { color: var(--dim); font-size: 11px; font-family: var(--mono); flex: none; width: 92px; text-align: right; }
    .gen { font-size: 10px; color: var(--accent); border: 1px solid var(--border); border-radius: 10px; padding: 0 6px; flex: none; }
    .nrev { display: inline-flex; gap: 4px; flex: none; }
    .nrev button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11px; font-family: inherit; }
    .nrev button:hover { border-color: var(--dim); }
    .nrev button.on { border-color: var(--accent2); color: var(--accent2); background: rgba(126,231,135,0.08); }
    .nrev button.stale { border-color: var(--warn); color: var(--warn); background: rgba(240,163,94,0.08); }
    @media (max-width: 720px) { .ndom, .nmeta, .gen { display: none; } }

    /* --- doc version status --- */
    .stchip { font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid; text-transform: lowercase; flex: none; }
    .stchip.fresh { color: var(--accent2); border-color: var(--accent2); }
    .stchip.stale { color: var(--warn); border-color: var(--warn); }
    .stchip.dangling, .stchip.removed { color: var(--bad); border-color: var(--bad); }
    /* Deliberately muted, not warning-coloured: "cannot be decided" is not a claim
       that anything drifted, and colouring it like drift is the false alarm the
       status exists to avoid. */
    .stchip.unverifiable { color: var(--dim); border-color: var(--dim); }
    .stchip.generated { display: none; }
    .tchip { font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid; text-transform: lowercase; flex: none; }
    .tchip.signed, .tchip.verified { color: var(--accent2); border-color: var(--accent2); background: rgba(126,231,135,0.08); }
    .tchip.checked { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,0.08); }
    .tchip.unverified { color: var(--dim); border-color: var(--border); }
    .tchip.stale { color: var(--warn); border-color: var(--warn); }
    /* The vouch is real and the code has moved since. Muted rather than hidden: the
       adjacent `stchip` already says `stale`, and dropping the vouch is what made one
       chip lossy. Struck through because the claim is about a body that is gone. */
    .tchip.moved { opacity: 0.55; background: none; text-decoration: line-through; }
    .tchip.clickable { cursor: pointer; }
    .tchip.clickable:hover { filter: brightness(1.3); box-shadow: 0 0 0 1px currentColor inset; }
    .vfork { font-size: 12px; color: var(--accent); margin-left: 8px; font-family: var(--mono); font-weight: 400; }
    .vaction { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; padding: 8px 12px; border: 1px solid var(--warn); border-radius: 8px; background: rgba(240,163,94,0.07); font-size: 13px; }
    .vaction.bad { border-color: var(--bad); background: rgba(242,123,123,0.07); }
    .vaction button { background: var(--panel2); border: 1px solid var(--accent2); color: var(--accent2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    .vaction.bad button { border-color: var(--bad); color: var(--bad); }
    .nver { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; margin: 4px 0; font-size: 12.5px; }
    .nvbranch { font-family: var(--mono); font-size: 12px; }
    b.bad, .bad { color: var(--bad); }

    /* --- event matrix --- */
    .mstats { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .mstats .bad { color: var(--bad); } .mstats .ok { color: var(--accent2); }
    .mlegend { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; font-size: 11.5px; }
    .mchk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--dim); }
    .mwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    .mhead, .mrow { display: flex; align-items: stretch; border-top: 1px solid var(--border); min-width: max-content; }
    .mhead { position: sticky; top: 0; background: var(--panel); border-top: none; z-index: 1; }
    .mrow:hover { background: var(--panel); }
    .mrow.orphan { background: rgba(242,123,123,0.07); box-shadow: inset 3px 0 0 var(--bad); }
    .mev { width: 280px; flex: none; padding: 7px 12px; display: flex; flex-direction: column; gap: 1px; cursor: pointer; overflow: hidden; }
    .mev b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mev small { color: var(--dim); font-size: 11px; font-family: var(--mono); }
    .mhead .mev { justify-content: flex-end; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; cursor: default; }
    .mhead .mev em { font-style: normal; text-transform: none; letter-spacing: 0; }
    .msink { width: 54px; flex: none; padding: 8px 4px; border-left: 1px solid var(--border); cursor: pointer; font-family: var(--mono); font-size: 12px; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: flex; align-items: center; justify-content: flex-start; }
    .msink.aggregate { color: var(--accent2); } .msink.projection { color: var(--accent); }
    .msink:hover { background: var(--panel2); }
    .mcell { width: 54px; flex: none; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--border); }
    .cdot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .cdot.folds { background: var(--accent2); } .cdot.projects { background: var(--accent); }
    .mrevh { width: 112px; flex: none; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--border); }
    .mhead .mrevh { font-size: 11px; color: var(--dim); text-transform: uppercase; }

    /* --- force-directed graph explorer --- */
    .gtools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .gtools .gfl { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
    .gtools .gfl:first-child { margin-left: 0; }
    .gchip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 12px; border: 1px solid; cursor: pointer; color: var(--text); background: var(--panel2); }
    .gchip.off { opacity: 0.35; text-decoration: line-through; }
    svg.explorer { width: 100%; height: calc(100vh - 215px); min-height: 520px; background: #0b0e13; border: 1px solid var(--border); border-radius: 8px; cursor: grab; display: block; }
    svg.explorer.grabbing { cursor: grabbing; }
    .gn { cursor: pointer; }
    .gn rect { fill: #161b22; stroke: #3a4250; stroke-width: 1.2; }
    .gn text { fill: #d7dde5; font-size: 10px; font-family: var(--mono); text-anchor: middle; pointer-events: none; }
    .gn.command rect { stroke: #d2a8ff; } .gn.handler rect { stroke: #79c0ff; } .gn.event_family rect { stroke: #7ee787; }
    .gn.aggregate rect { stroke: #58a6ff; } .gn.projection rect { stroke: #f0a35e; } .gn.process rect { stroke: #f778ba; } .gn.step rect { stroke: #a5d6ff; }
    .gn.sel rect { stroke-width: 2.4; fill: #1c232d; }
    .gn .more { fill: var(--accent); } .gn .morec { fill: #0b0e13; font-size: 8px; text-anchor: middle; font-weight: 700; }
    .gn .revdot { fill: var(--accent2); }
    .ge { stroke: #6b7684; stroke-width: 1.2; opacity: 0.5; }
    .ge.folds { stroke: #7ee787; } .ge.projects { stroke: #f0a35e; } .ge.emits { stroke: #79c0ff; } .ge.handles { stroke: #d2a8ff; }
    .ge.touches { stroke: #f778ba; } .ge.step_of { stroke: #a5d6ff; } .ge.part_of { stroke: #8b95a3; } .ge.depends_on { stroke: #58a6ff; } .ge.calls_api { stroke: #ffab70; }
    svg.explorer.hovering .gn:not(.hl) { opacity: 0.16; }
    svg.explorer.hovering .ge:not(.hl) { opacity: 0.05; }
    .ge.hl { opacity: 1; stroke-width: 2; }
    .gn.hl rect { stroke-width: 2.2; }
    .gsel { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
    .gsel .gseltitle { font-family: var(--mono); flex: 1; }
    .gsel button { background: var(--panel2); border: 1px solid var(--border); color: var(--accent); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    .gsel button.greset { color: var(--dim); }

    /* --- layered event pipeline --- */
    svg.pipeline { width: 100%; height: calc(100vh - 175px); min-height: 540px; background: #0b0e13; border: 1px solid var(--border); border-radius: 8px; cursor: grab; display: block; }
    svg.pipeline.grabbing { cursor: grabbing; }
    .pn { cursor: pointer; }
    .pn rect { fill: #161b22; stroke: #3a4250; stroke-width: 1; }
    .pn text { fill: #c9d4e2; font-size: 10px; font-family: var(--mono); pointer-events: none; }
    .pn.command rect { stroke: #d2a8ff; } .pn.handler rect { stroke: #79c0ff; }
    .pn.event_family rect { stroke: #7ee787; } .pn.aggregate rect { stroke: #58a6ff; } .pn.projection rect { stroke: #f0a35e; }
    .pn .revdot { fill: var(--accent2); }
    .pn .revdot.checked { fill: var(--accent); }
    .pe { fill: none; stroke: #6b7684; stroke-width: 1; opacity: 0.4; }
    .pe.folds { stroke: #7ee787; } .pe.projects { stroke: #f0a35e; } .pe.emits { stroke: #79c0ff; } .pe.handles { stroke: #d2a8ff; }
    .plabel { fill: var(--dim); font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px; }
    svg.pipeline.hovering .pn:not(.hl) { opacity: 0.16; }
    svg.pipeline.hovering .pe:not(.hl) { opacity: 0.04; }
    .pe.hl { opacity: 1; stroke-width: 1.8; }
    .pn.hl rect { stroke-width: 2; }
    /* --- state map (rides the pipeline svg/pan/hover styles) --- */
    .pn.state rect { stroke: #e3b341; }
    .pn.transition rect { stroke: #8b95a3; fill: #10141b; }
    .pn.transition text { fill: #aeb8c6; }
    .pn.dashed rect, .pe.dashed { stroke-dasharray: 4 3; }
    .pe.transitions_to { stroke: #e3b341; } .pe.from_state { stroke: #8b95a3; } .pe.gutter { stroke: #6b7684; }
    .pn .initdot { fill: #7ee787; }
    .pn .trustdot.verified { fill: #7ee787; } .pn .trustdot.checked { fill: #58a6ff; }
    .pn .trustdot.stale { fill: #f0a35e; } .pn .trustdot.unverified { fill: #0b0e13; stroke: #8b95a3; }

    /* --- branch diff viewer --- */
    .dim { color: var(--dim); font-size: 12.5px; }
    .dpick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
    .dpick label { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .dpick select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font-family: var(--mono); font-size: 12.5px; max-width: 320px; }
    .dpick .arrow, .dsummary .arrow { color: var(--dim); }
    .dsummary { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; font-family: var(--mono); font-size: 13px; }
    .dcounts { margin-left: auto; display: inline-flex; gap: 10px; font-weight: 600; }
    .dcounts i { font-style: normal; }
    .dcounts .added, .dt.added, .cl.added .g { color: var(--accent2); }
    .dcounts .removed, .dt.removed, .cl.removed .g { color: var(--bad); }
    .dcounts .changed, .dt.changed { color: var(--warn); }

    /* Two independently-scrolling panes filling the viewport: the change list on the
       left, the (wide) diff on the right — so scrolling the diff never runs out. */
    .dgrid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; height: calc(100vh - 250px); min-height: 420px; }
    @media (max-width: 820px) { .dgrid { grid-template-columns: 1fr; height: auto; } }
    /* min-width:0 lets a long code line scroll inside the pane instead of stretching the grid. */
    .dleft, .dright { min-width: 0; overflow-y: auto; }
    .dleft .sec:first-child { margin-top: 0; }

    .dflow { border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; overflow: hidden; }
    .dflowt { padding: 8px 12px; background: var(--panel); font-weight: 600; cursor: pointer; color: var(--text); }
    .dflowt:hover { color: var(--accent); }
    .dstep { padding: 6px 12px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .dstep .stn { font-size: 12.5px; color: var(--dim); }

    .dfile { border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; overflow: hidden; }
    .dfileh { padding: 7px 12px; background: var(--panel); font-family: var(--mono); font-size: 12.5px; cursor: pointer; }
    .dfileh:hover { color: var(--accent); }
    .drow { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--border); cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
    .drow:hover { background: var(--panel); }
    .drow.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
    .dt { width: 14px; text-align: center; font-weight: 700; flex: none; }
    .dsym { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dk { color: var(--dim); font-size: 11px; }

    .ddetail { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 14px; }
    .dsymhead { font-family: var(--mono); font-size: 14px; }
    .drev { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 12.5px; }
    .ddoc { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
    .ddoch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ddoct { font-weight: 600; cursor: pointer; }
    .ddoct:hover { color: var(--accent); }
    .ddoc .md { font-size: 12.5px; color: var(--dim); }
    .ddacts { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .ddacts button { background: var(--panel2); border: 1px solid var(--accent2); color: var(--accent2); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11px; }
    .ddacts button.bad { border-color: var(--bad); color: var(--bad); }
    /* doc-forward view */
    .dtoggle { display: flex; align-items: center; gap: 6px; margin: 12px 0 8px; }
    .dtoggle button { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
    .dtoggle button.on { color: var(--text); border-color: var(--accent); background: var(--panel); }
    .dfdoc { border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
    .dfdoc.stale { border-left-color: var(--warn); } .dfdoc.dangling { border-left-color: var(--bad); } .dfdoc.fresh { border-left-color: var(--accent2); }
    .dfdh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .dfdt { font-weight: 600; cursor: pointer; } .dfdt:hover { color: var(--accent); }
    .chip.mini { font-family: var(--mono); font-size: 11px; padding: 2px 6px; }
    .chip.warn { border-color: var(--warn); color: var(--warn); }

    pre.cdiff { padding: 0; overflow-x: auto; max-width: 100%; }
    .cl { display: flex; gap: 8px; padding: 0 10px; min-height: 1.55em; white-space: pre; width: max-content; min-width: 100%; }
    .cl .g { width: 10px; flex: none; color: var(--dim); user-select: none; }
    .cl code { background: none; padding: 0; font-family: var(--mono); font-size: 12.5px; }
    .cl.added { background: rgba(126, 231, 135, 0.10); }
    .cl.removed { background: rgba(242, 123, 123, 0.10); }
    /* doc prose diff: wrap long summary/body lines instead of scrolling */
    pre.docdiff { white-space: normal; }
    .docdiff .cl { white-space: pre-wrap; word-break: break-word; min-width: 0; width: auto; }
    .dfdoc.sel { background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent); }
    .dbug { border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px; padding: 7px 10px; margin: 6px 0; }
    .dbug.poss { border-left-color: var(--warn); }
    .dreq { border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px; padding: 7px 10px; margin: 6px 0; }
    .dreq.moved { border-left-color: var(--warn); }
    .dreqs { font-size: 10px; font-family: var(--mono); color: var(--dim); flex: none; }
    .dbugh { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .dbugh:hover .dbugt { color: var(--accent); }
    .dbugt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* side-by-side doc modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 3vh 3vw; }
    .modal { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 1500px; height: 94vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
    .modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); font-family: var(--mono); font-size: 14px; }
    .modal-x { margin-left: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 14px; }
    .modal-x:hover { color: var(--text); }
    .modal-body { flex: 1; min-height: 0; }
    .sxs { display: grid; grid-template-columns: 1fr 1fr; }
    .sxs-col { min-width: 0; overflow-y: auto; padding: 16px 20px; border-right: 1px solid var(--border); }
    .sxs-col:last-child { border-right: none; }
    .sxs-h { position: sticky; top: -16px; background: var(--bg); margin: -16px -20px 12px; padding: 8px 20px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; color: var(--accent); z-index: 1; }

    /* --- node code-review page --- */
    .rvbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin: 10px 0 14px; font-size: 13px; }
    .rvtrack { flex: 1; min-width: 120px; height: 6px; border-radius: 3px; background: #20262f; overflow: hidden; }
    .rvtrack i { display: block; height: 100%; background: var(--accent2); }
    .rvseg { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
    .rvseg.done { border-color: #24303a; background: rgba(126,231,135,0.02); }
    /* the segment header sticks under the global header so viewed/signed stay reachable while reading a long block */
    .rvhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; background: var(--bg); border-radius: 7px 7px 0 0; position: sticky; top: var(--hdr-h); z-index: 3; }
    .rvhead:hover { background: var(--panel); }
    .rvchev { color: var(--dim); width: 12px; }
    .rvstate { color: var(--dim); } .rvstate.ok { color: var(--accent2); } .rvstate.checked { color: var(--accent); }
    .rvsym { color: var(--text); font-weight: 600; }
    .rvfile { font-size: 11.5px; }
    .rvhead .rev { margin-left: auto; }
    .rvcode { margin: 0 !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; border-bottom: none !important; }
    .rvfilebody { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    .rvfilecode { min-width: 0; overflow: auto; background: #0b0e13; }
    .rvpre { font-family: var(--mono); font-size: 12px; line-height: 1.5; padding: 8px 0; background: #0b0e13; }
    /* standalone snippets (flow, node segments, review cards) render as a code block */
    .rvseg .rvpre, .anchor-code .rvpre { border: 1px solid var(--border); border-radius: 6px; margin: 4px 0 0; overflow-x: auto; }
    .fline { display: flex; gap: 12px; padding: 0 14px; white-space: pre; min-width: max-content; }
    /* Same rule for the walkthrough's plain-source pane, which had no horizontal
       scroll of its own — a long line pushed the whole page sideways instead. */
    .prsbody .rvpre { overflow-x: auto; }
    .prsbody .rvpre .rvfind, .prsbody .rvpre .rvaddf { position: sticky; left: 0; }
    .prsbody .rvpre .flcomment { position: sticky; right: 0; }
    .fline.fhl { background: rgba(88,166,255,0.14); }
    .flno { color: #4a5666; text-align: right; width: 44px; flex: none; user-select: none; }
    .fltext { color: #c9d4e2; }
    .rvfileside { overflow-y: auto; border-left: 1px solid var(--border); padding: 16px 16px; }
    .rvaside { padding: 8px 0; border-top: 1px solid var(--border); }
    .rvaside:first-of-type { border-top: none; }
    .rvaside.active { background: rgba(88,166,255,0.08); margin: 0 -16px; padding: 8px 16px; }
    .rvasym { font-family: var(--mono); font-size: 12px; cursor: pointer; margin-bottom: 6px; }
    .rvasym:hover { color: var(--accent); }
    /* findings (line-pinned notes) */
    .rvfbadge { color: var(--warn); font-size: 11.5px; margin-left: 6px; font-family: var(--mono); }
    .rvfcount { color: var(--warn); font-size: 12.5px; }
    .rvfinds { padding: 8px 12px 10px 32px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 6px; }
    .rvfinds.compact { padding: 6px 12px 8px; border-top: none; gap: 5px; }
    .rvfhdr { font-size: 11.5px; }
    /* WRAPS. `.asgndetail` carries `flex-basis: 100%` to claim its own line, but a
       flex row that cannot wrap just made it an over-wide item instead — an agent's
       report ran off the right edge of the page and squeezed the finding text into a
       tall thin column beside it. */
    .rvfind { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 12.5px; min-width: 0; }
    .rvfind.resolved { opacity: 0.5; text-decoration: line-through; }
    .rvfind.resolved .annores { text-decoration: none; }
    .rvfpin { color: var(--warn); font-family: var(--mono); font-size: 11.5px; flex: none; }
    /* review-annotation kinds: pointer = a watch-out aid (blue), finding = an issue (amber) */
    .rvfind.k-pointer { }
    .rvfind.k-pointer .rvfpin { color: var(--accent); }
    .rvfind.k-question .rvfpin { color: var(--accent); }
    .rvfsev { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
    .rvfcat { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; flex: none; }
    /* Takes the row, but may shrink and must break inside the code identifiers these
       findings are full of (`session.Query<Aircraft>().FirstOrDefaultAsync(...)`),
       which otherwise set an unbreakable minimum width and force the row wider. */
    .rvftext { flex: 1 1 22em; min-width: 0; overflow-wrap: anywhere; }
    .rvfauthor { font-size: 11px; flex: none; }
    .rvaddbtn { align-self: flex-start; background: none; border: 1px dashed var(--border); color: var(--dim); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
    .rvaddbtn:hover { border-style: solid; color: var(--text); }
    .rvaddf { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    /* the refusal wraps to its own line: it is a paragraph asking for a rewrite, not a chip */
    .rvaddf .rvferr { flex-basis: 100%; color: var(--warn); font-size: 12px; line-height: 1.45; }
    .rvaddf input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12.5px; }
    .rvfline { width: 64px; }
    .rvftextin { flex: 1; min-width: 180px; }
    .rvaddf .ghost { background: none; color: var(--dim); }
    /* file-modal line findings + hover-to-comment */
    .flrow { }
    .fline { position: relative; }
    .flcomment { position: absolute; right: 6px; top: 0; opacity: 0; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; font-size: 11px; padding: 0 5px; line-height: 1.5; }
    .fline:hover .flcomment { opacity: 1; }
    .flrow .rvfind { padding: 3px 14px 3px 56px; background: rgba(240,163,94,0.06); }
    .flrow .rvaddf { padding: 5px 14px 5px 56px; background: rgba(240,163,94,0.06); }

    /* --- dashboard --- */
    .attn-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--warn); border-radius: 10px; background: rgba(240,163,94,0.08); margin-bottom: 16px; }
    .attn-banner.ok { border-color: var(--border); background: var(--panel); color: var(--dim); }
    .attn-n { font-weight: 700; color: var(--warn); font-size: 16px; }
    .attn-banner.ok .attn-n { color: var(--accent2); }
    .attn-pill { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--warn); color: var(--warn); cursor: pointer; }
    .attn-pill.bad { border-color: var(--bad); color: var(--bad); }
    .attn-pill:hover { background: rgba(240,163,94,0.15); }
    .attn-hint { color: var(--dim); font-size: 12px; margin-left: auto; }
    .dcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .dcard { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 14px 16px; }
    .dch { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); margin-bottom: 10px; }
    .dstats { display: flex; gap: 18px; }
    .dstat { min-width: 0; }
    .dsv { font-size: 22px; font-weight: 700; font-family: var(--mono); }
    .dsl { font-size: 11.5px; color: var(--dim); }
    .dsx { font-size: 10.5px; color: var(--warn); margin-top: 1px; }
    .dclink { display: inline-block; margin-top: 12px; color: var(--accent); cursor: pointer; font-size: 13px; }
    .dclink.dim { color: var(--dim); cursor: default; font-family: var(--mono); font-size: 11.5px; }
    .dnav { display: flex; flex-wrap: wrap; gap: 8px; }
    .dnav button, .dnav a { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
    .dnav button:hover { border-color: var(--accent); }
    /* An input in a `.dnav` row got the browser's default chrome — a white box in a dark
       app — because only `button` and `a` were dressed here. */
    .dnav input { flex: 1 1 260px; min-width: 0; background: var(--panel2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 14px; font-size: 13px; font-family: inherit; }
    .dnav input:focus { outline: none; border-color: var(--accent); }
    .attn-pill.q { border-color: var(--accent); color: var(--accent); cursor: default; }
    .dq { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
    .dq.resolved { border-left-color: var(--border); opacity: 0.6; }
    .dqh { display: flex; align-items: center; gap: 8px; }
    .dqt { color: var(--accent); cursor: pointer; font-weight: 600; }
    .dqt:hover { text-decoration: underline; }
    .dq.drift { border-left-color: var(--warn); }
    .qbadge.drift { border-color: var(--warn); color: var(--warn); font-family: var(--mono); }

    .uref { color: var(--accent); cursor: pointer; font-weight: 700; font-family: var(--mono); }
    .uref:hover { text-decoration: underline; }

    /* --- notes & questions thread --- */
    .anno { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; background: var(--panel2); }
    .anno.q { border-left: 3px solid var(--accent); }
    .anno.q.resolved { border-left-color: var(--border); opacity: 0.65; }
    .annometa { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 2px; }
    .qbadge { font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); text-transform: lowercase; }
    .annores { margin-left: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 11.5px; }
    .annores:hover { border-color: var(--accent2); color: var(--accent2); }
    .annoadd { margin-top: 8px; }
    .annoadd textarea { width: 100%; min-height: 58px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; }
    .annobtns { display: flex; gap: 8px; margin-top: 6px; }
    .annobtns button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; }
    .annobtns button.q { border-color: var(--accent); color: var(--accent); }
    .annobtns button:hover { filter: brightness(1.2); }

    /* --- orphans: work pointing at code the tree no longer has --- */
    .orphans { max-width: 1100px; }
    .ohead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
    .ofilters { display: flex; gap: 6px; margin-left: auto; }
    .olocate { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 9px 12px; margin-bottom: 16px;
      border: 1px dashed var(--border); border-radius: 8px; color: var(--dim); font-size: 12.5px; }
    .ogroup { margin-bottom: 20px; }
    .ogh { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 6px; }
    .ogh b { color: var(--text); font-family: var(--mono); letter-spacing: 0; }
    .ogh .dim { text-transform: none; letter-spacing: 0; font-size: 12px; }
    .orow { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border: 1px solid var(--border);
      border-left: 3px solid var(--border); border-radius: 8px; margin: 5px 0; }
    .orow .oloc { flex: none; width: 230px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .orow .oloc code { font-size: 12px; }
    .orow .obody { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .orow .olabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .okind { font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--dim); flex: none; }
    .okind.k-annotation { color: var(--accent); border-color: var(--accent); }
    .okind.k-bug { color: var(--warn); border-color: var(--warn); }
    .owhy, .oat { font-size: 11.5px; font-family: var(--mono); flex: none; }
    .orest { font-size: 12px; padding: 4px 10px; }

    /* --- bugs --- */
    .bugfilter button .n { color: var(--dim); font-size: 11px; margin-left: 4px; }
    .brow { display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px; border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px; margin: 6px 0; cursor: pointer; }
    .brow:hover { background: var(--panel); }
    .brow.open { border-left-color: var(--warn); }
    .brow.fixed { border-left-color: var(--accent2); }
    .brow.wontfix, .brow.invalid { border-left-color: var(--dim); }
    .brow.sel { background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent); }
    /* Two lines on purpose. One line put a 13px title in a ~180px gap left over by the
       chips, so every title ellipsized at about twenty characters. The status belongs
       under the title, where the whole 340px column is free. */
    .brow .bmain { flex: 1; min-width: 0; }
    .brow .sevdot { margin-top: 5px; }
    .brow .btitle { font-size: 13.5px; line-height: 1.35; color: var(--text); overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
    .brow .bsub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .brow .bmeta { color: var(--dim); font-size: 11.5px; font-family: var(--mono); flex: none; }
    .sevdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .bchip { font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--dim); flex: none; text-transform: lowercase; }
    .bchip.open { color: var(--warn); border-color: var(--warn); }
    .bchip.fixed { color: var(--accent2); border-color: var(--accent2); }
    .bchip.poss, .bchip.changed { color: var(--warn); border-color: var(--warn); background: rgba(240,163,94,0.08); }
    /* An outstanding ASK is louder than "needs you": somebody is waiting on a decision
       from a person, and the whole point of surfacing it is that it stops being missed. */
    .bchip.ask { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,0.10); font-weight: 600; }
    /* A closed bug in the search results is history — findable, visibly not live. */
    .sym.shut { opacity: 0.55; }
    .sym.shut > span:nth-child(2) { text-decoration: line-through; }
    .drev .bwit { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; margin-left: 8px; }
    .drev .bwit:hover { border-color: var(--dim); color: var(--text); }
    .banchor { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; margin: 5px 0; cursor: pointer; font-family: var(--mono); font-size: 12px; }
    .banchor:hover { border-color: var(--accent); }
    .banchor.stale { border-color: var(--warn); }
    .banchor.gone { opacity: 0.6; }
    .banchor .basym { color: var(--text); }
    .banchor .bafile { color: var(--dim); margin-left: auto; }
    /* NOT `.row` — that is the outline's `grid-template-columns: 24px 1fr 96px …` file
       row. Reusing it here put the comment textarea in the 24px column, which is why it
       rendered two characters wide, and wrapped `link a ticket` over three lines. */
    .bactions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .bcompose { display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
    .bdraft { flex: 1; min-width: 0; resize: vertical; font: inherit; font-size: 13px; line-height: 1.4;
      padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); }
    .bdraft:focus { outline: none; border-color: var(--accent); }
    .btrackform { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .btrackform input { font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--panel2); color: var(--text); min-width: 0; }
    .btrackform input:focus { outline: none; border-color: var(--accent); }
    .bcomment { padding: 8px 10px; border-top: 1px solid var(--border); }
    .bcomment:first-child { border-top: none; }
    .btrack { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .bhist { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .bhist .hline { padding: 5px 10px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .bhist .hline:first-child { border-top: none; }
    .warn { color: var(--warn); }

    /* --- PR walkthrough ------------------------------------------------- */
    .prhead { margin-bottom: 14px; }
    .prhead h2 { margin: 0 0 4px; font-size: 17px; }
    .prstats { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--dim); flex-wrap: wrap; }
    .prstats b { color: var(--text); }
    .prstats .warn { color: #f0a35e; }
    .prchapter { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; background: var(--panel); }
    .prchead { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; }
    .prtwisty { color: var(--dim); width: 12px; }
    .prctitle { font-size: 13.5px; }
    .prcount { margin-left: auto; font-size: 12px; white-space: nowrap; }
    .prbadge { font-size: 10.5px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--dim); }
    .prbadge.spec { border-color: #2d4a63; color: #79c0ff; }
    .prbadge.durable { border-color: #2f5d3a; color: #7ee787; }
    .prbadge.orphan { border-color: #5d4a2f; color: #f0a35e; }
    .prcbody { padding: 4px 12px 12px; border-top: 1px solid var(--border); }
    .prcbody .md { font-size: 12.5px; color: var(--dim); max-height: 320px; overflow-y: auto; border-left: 2px solid var(--border); padding-left: 10px; margin: 8px 0 12px; }
    .prorphan { font-size: 12.5px; margin: 6px 0 10px; }
    .prstep { border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; background: var(--bg); }
    .prstep.done { border-color: #24303a; background: rgba(126,231,135,0.02); }
    /* The sign-off row rides with the symbol: on a long body it used to scroll out
       of reach, so marking something signed meant scrolling back up to find it.
       Sits just under the page header, like the other sticky heads. */
    .prsthead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px;
                position: sticky; top: var(--hdr-h); z-index: 2; background: var(--bg); border-radius: 6px 6px 0 0; }
    .prstep.done .prsthead { background: #0d1411; }
    /* so scrollIntoView does not tuck the step under the sticky header */
    .prstep { scroll-margin-top: calc(var(--hdr-h) + 10px); }
    .prlayer { font-size: 10.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 10px; padding: 0 6px; white-space: nowrap; }
    .prchg { font-size: 11px; font-weight: 600; width: 58px; }
    .prsig { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .prfile { font-size: 11.5px; white-space: nowrap; }
    .prfind { color: #f0a35e; font-size: 11.5px; }
    .prrev { margin-left: 4px; }
    .prsbody { padding: 0 10px 10px; }
    .prstools { display: flex; align-items: center; gap: 10px; font-size: 11.5px; margin: 4px 0 6px; font-family: var(--mono); }
    .prload { padding: 6px 10px; font-size: 12px; }
    .prbase { border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; opacity: 0.85; }
    .rev button.reverted, button.reverted { border-color: #8a5a2b; color: #f0a35e; }
    /* Warning colour, but its own glyph (?) and tooltip: nothing DRIFTED — the mark
       simply cannot be checked against this build, and the fix is to click it. */
    .rev button.unverifiable, .nrev button.unverifiable, button.unverifiable { border-color: var(--warn); color: var(--warn); background: rgba(240,163,94,0.08); }
    .rd.unverifiable { background: var(--warn); }
    .viaflag { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); white-space: nowrap; }
    .viaflag.rev-back { border-color: #8a5a2b; color: #f0a35e; }
    .viaflag.rev-replay { border-color: #2d4a63; color: #79c0ff; }
    .viaflag.unverifiable { border-color: var(--warn); color: var(--warn); }
    /* Your unpublished mark and the team's disagree; the safer value is shown. */
    /* Not an orphan: this store cannot see the wiring yet. */
    .mrow.pending-analyzer { opacity: 0.75; border-left: 2px solid var(--dim); }
    .dchip { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--warn); color: var(--warn); white-space: nowrap; margin-left: 4px; }
    /* The shared hub: joining a team, and repairing a fork. */
    .hubhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 10px; font-size: 13px; }
    .hubrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
    .hubrow b { min-width: 70px; }
    .hubrow .warn { color: var(--warn); }
    .hubblocked { border: 1px solid #6b2d2d; border-radius: 6px; padding: 10px; margin: 10px 0; }
    .hubheal { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
    .hubheal button { margin-top: 8px; }
    .hubresult { margin-top: 12px; padding: 8px 10px; border: 1px solid #2f5d3a; border-radius: 6px; font-size: 13px; }
    .hubresult.err { border-color: #6b2d2d; color: var(--bad); }
    .pushelsewhere { margin: 8px 0; font-size: 12px; }
    .pushelsewhere button { margin-left: 8px; }
    .rd.reverted { background: #f0a35e; }
    .rheat.has-reverted { outline: 1px solid #8a5a2b; outline-offset: 1px; }
    .prbadge.promoted { border-color: #2f5d3a; color: #7ee787; cursor: pointer; }
    button.prbadge.durable { cursor: pointer; background: transparent; }
    button.prbadge.durable:hover { border-color: #7ee787; }
    .prpromo { margin: 0 12px 10px; padding: 10px; border: 1px solid #2f5d3a; border-radius: 6px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
    .prpromo.err { border-color: #6b2d2d; color: #f27b7b; }
    .prpromo label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
    .prpromo input { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 5px 7px; font-size: 13px; }
    .prpush { border-top: 1px solid var(--border); padding-top: 8px; }
    .prfindings { margin: 0 12px 10px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
    /* The team's findings, modelled on GitHub's code-scanning alert list: one line
       per finding, location and provenance on a muted second line, evidence behind a
       click. The 3px left rail is the only ornament and it encodes severity, so a long
       list reads as a severity spectrum without a badge on every row. */
    /* A finding on the anchor's own page. Same severity rail as the pull-request list,
       because it is the same object seen from the other side. */
    /* The hub's pull-request index. There was no path from here to a PR's findings at
       all — you had to know the number and type the URL. */
    .hubsec { margin: 16px 0 6px; font-size: 11.5px; color: var(--dim); text-transform: uppercase;
      letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
    .hubpr { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; margin: 4px 0;
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
    .hubpr:hover { border-color: var(--accent); }
    .hubpr .hubgo { margin-left: auto; color: var(--dim); }
    .afind { border-left: 3px solid var(--border); background: var(--panel); border-radius: 0 6px 6px 0;
      padding: 7px 12px; margin: 5px 0; }
    .afind.sev-critical, .afind.sev-high { border-left-color: var(--bad); }
    .afind.sev-medium { border-left-color: var(--warn); }
    .afind .tfmeta { margin-left: 0; }
    .afind .tfmeta a { color: var(--accent); text-decoration: none; }
    .afind .tfmeta a:hover { text-decoration: underline; }
    .afindtext { margin-top: 4px; color: var(--text); overflow-wrap: anywhere; }
    .tfind { border-left: 3px solid var(--border); background: var(--panel); border-radius: 0 6px 6px 0;
      padding: 7px 12px; margin: 5px 0; cursor: pointer; }
    .tfind:hover { background: var(--panel2); }
    .tfind.sev-critical, .tfind.sev-high { border-left-color: var(--bad); }
    .tfind.sev-medium { border-left-color: var(--warn); }
    .tfind.sev-low { border-left-color: var(--dim); }
    /* Closed out: still readable, plainly done. */
    .tfind.tf-settled { opacity: 0.55; }
    .tfhead { display: flex; gap: 10px; align-items: baseline; }
    .tfsev { flex: none; width: 54px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--dim); }
    .sev-critical .tfsev, .sev-high .tfsev { color: var(--bad); }
    .sev-medium .tfsev { color: var(--warn); }
    .tftitle { flex: 1 1 auto; min-width: 0; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tfind.tf-open .tftitle { white-space: normal; }
    .tfmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
      margin: 3px 0 0 64px; font-size: 11.5px; color: var(--dim); }
    .tfloc { font-family: var(--mono); color: var(--accent); }
    .tfloc:hover { text-decoration: underline; }
    .tfvote { font-family: var(--mono); }
    .tfbody { margin: 8px 0 2px 64px; padding-top: 8px; border-top: 1px solid var(--border);
      font-size: 12.5px; line-height: 1.6; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .tfsev { width: auto; }
      .tfmeta, .tfbody { margin-left: 0; }
    }

    .prfgroup { margin-bottom: 10px; }
    .prfgroup:last-child { margin-bottom: 0; }
    .prfgh { font-size: 11.5px; color: var(--dim); text-transform: lowercase; padding: 2px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .prfgh a { color: var(--accent); cursor: pointer; text-decoration: none; margin-left: 8px; }
    .prfgh a:hover { text-decoration: underline; }
    .prfrow { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .prfrow:last-child { border-bottom: none; }
    .prfloc { flex: none; width: 190px; font-size: 11.5px; cursor: pointer; padding-top: 3px; overflow-wrap: anywhere; }
    .prfloc:hover code { color: var(--accent); text-decoration: underline; }
    .prfloc code { color: var(--text); }
    .prfrow .rvfind { flex: 1 1 auto; min-width: 0; }
    .prfindings { overflow-x: hidden; }
    /* The finding and its submitter-facing half stack; the location stays beside them. */
    .prfbody { flex: 1 1 auto; min-width: 0; }
    .prfcmt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 12px; padding: 2px 0 4px; }
    .prfcmttext { flex: 1 1 20em; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
    .prfcmt button { font-size: 11px; padding: 1px 6px; }
    .prfkind { font-size: 10.5px; padding: 0 5px; border-radius: 8px; border: 1px dashed var(--border); color: var(--dim); }
    .prfdisp { font-size: 10.5px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--border); text-transform: lowercase; }
    .prfdisp.d-confirmed, .prfdisp.d-partial, .prfdisp.d-rerated { border-color: var(--accent); color: var(--accent); }
    .prfdisp.d-refuted, .prfdisp.d-accepted { color: var(--dim); }
    .prfedit { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 8px; }
    .prfedit label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--dim); }
    .prfedit textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; resize: vertical;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 6px; }
    .prfeditrow { display: flex; flex-wrap: wrap; gap: 10px; }
    .prfeditrow label { flex: 1 1 12em; }
    .prfeditrow input, .prfeditrow select { font: inherit; font-size: 12px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; min-width: 0; }
    .prfeditacts { display: flex; gap: 6px; }
    /* Elected findings that cannot land on this diff. Loud on purpose: the whole
       point is that they used to disappear without the plan admitting it. */
    .prfpick { flex: none; display: flex; align-items: center; padding-top: 4px; }
    .prfpicked { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px;
      padding: 6px 8px; margin-bottom: 8px; border: 1px solid var(--accent); border-radius: 5px; }
    .pushsum { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .pushsum label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--dim); }
    .pushsum textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; resize: vertical;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 7px; }
    .pushevent { display: flex; flex-wrap: wrap; gap: 6px; }
    .pushevent label { flex-direction: row; align-items: center; gap: 4px; font-size: 12px; cursor: pointer;
      border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
    /* A verdict is a different act from leaving comments; it should not look like
       one more checkbox on the way to the button. */
    .pushevent label.on { border-color: var(--accent); color: var(--accent); }
    .pushblocked { margin: 6px 0; padding: 6px 8px; border: 1px solid var(--warn); border-radius: 5px; }
    /* --- the agent-written walkthrough: features > chapters > interleaved blocks --- */
    .wkbanner { margin: 0 12px 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; line-height: 1.5; }
    .wkteam { border-left: 3px solid var(--accent, #6a9); }
    .wkfeature { margin: 0 0 18px; }
    .wkfhead { display: flex; align-items: baseline; gap: 10px; padding: 4px 12px; font-size: 14px; }
    .wkunstated { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #e3b341; border: 1px solid #7a5a1e; background: #2a2010; border-radius: 4px; padding: 0 5px; }
    .wkfsummary { padding: 0 12px 6px; max-width: 78ch; color: var(--dim); font-size: 13px; }
    .wkfsummary .md p { margin: 0 0 4px; }
    .wkchapter.stale { border-color: #7a5a1e; }
    /* Prose BETWEEN the symbols is what makes this a walkthrough rather than a wall
       of text with code boxes attached, so it is set to read as prose: measured line
       length, and indented to sit with the symbols it is talking about. */
    .wkprose { padding: 6px 14px 8px 22px; max-width: 78ch; font-size: 13px; line-height: 1.6; }
    .wkprose .md p { margin: 0 0 6px; }
    .wkprose .md code { font-size: 12px; }
    .wkacts { margin-left: auto; display: inline-flex; gap: 6px; }
    .wkacts button { font-size: 11.5px; padding: 1px 8px; }
    .wkacts button[disabled] { opacity: .55; cursor: default; }
    .wkuncovered .prchead b { color: #e3b341; }
    .pushrow { font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--border); }
    .pushrow code { color: var(--text); }
    .rvfraise { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--panel); color: var(--dim); cursor: pointer; }
    .rvfraise.on { border-color: #7a5a1e; background: #2a2010; color: #e3b341; }
    .rvfraise.mine { cursor: default; opacity: .65; }
    .prpromo-clash { border: 1px solid #7a5a1e; background: #2a2010; color: #e3b341; border-radius: 4px; padding: 7px 9px; font-size: 12px; line-height: 1.45; }
    .prpromo-clash code { color: var(--text); }
    .prpromoacts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .prpromoacts button[disabled] { opacity: .55; cursor: default; }
    /* The BLOCK scrolls sideways, never the individual line: a per-line
       `overflow-x` gave every long line its own scrollbar, so reading across one
       line left the rest behind. `min-width: max-content` lets a long line widen
       the row so the add/del tint reaches the end of it too. */
    .prdiff { overflow-x: auto; }
    .prdiff .dline { display: flex; align-items: baseline; font-family: var(--mono); font-size: 12px; line-height: 1.5; position: relative; min-width: max-content; }
    .prdiff .dsign { width: 16px; text-align: center; color: var(--dim); flex: none; user-select: none; }
    .prdiff .flno { width: 44px; text-align: right; padding-right: 10px; color: #5b6472; flex: none; user-select: none; }
    .prdiff .flcomment { opacity: 0; margin-left: auto; flex: none; background: none; border: none; cursor: pointer; padding: 0 6px; }
    .prdiff .dline:hover .flcomment { opacity: 1; }
    .prdiff .dline.add { background: rgba(126,231,135,0.09); }
    .prdiff .dline.add .dsign { color: #7ee787; }
    .prdiff .dline.del { background: rgba(248,81,73,0.09); }
    .prdiff .dline.del .dsign { color: #f85149; }
    .prdiff .fltext { white-space: pre; }
    /* Findings and the raise button live in the scrolling block, so pin them to the
       visible edges rather than letting them slide away with the code. */
    .prdiff .flcomment { position: sticky; right: 0; }
    .prdiff .rvfind, .prdiff .rvaddf, .prdiff .rvfinds { position: sticky; left: 0; }
    .prdiffhint { font-size: 11.5px; margin-top: 4px; }
    .crlf { font-size: 11px; color: #f0a35e; border: 1px solid #8a5a2b; border-radius: 10px; padding: 0 6px; }
    .prderive { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; flex-wrap: wrap; }
    .prderive .warn { color: #f27b7b; }
    .asgn { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); white-space: nowrap; }
    .asgn.pending { color: #79c0ff; border-color: #2d4a63; }
    .asgn.done.r-fixed { color: #7ee787; border-color: #2f5d3a; }
    .asgn.done.r-answered { color: #79c0ff; border-color: #2d4a63; }
    .asgn.done.r-declined { color: #f0a35e; border-color: #8a5a2b; }
    .asgnacts { display: inline-flex; gap: 4px; }
    .asgnacts button { font-size: 11px; padding: 0 6px; }
    .asgndetail { flex-basis: 100%; width: 100%; min-width: 0; font-size: 12px; color: var(--dim); margin-top: 4px; padding-left: 22px; overflow-wrap: anywhere; white-space: pre-wrap; }
    /* Controls keep their size rather than being squeezed to a wrapped stub. */
    .asgn, .asgnacts, .rvfraise, .annores, .rvfpin, .rvfsev, .rvfcat, .rvfauthor { flex: none; }
    /* `.annores` is right-aligned in the notes thread, where it is the only control.
       In a finding row it has neighbours, and on a WRAPPED line the auto margin
       stranded `resolve` opposite `raise` with a gap between them. `.rvftext` grows
       instead, which pushes the whole group right on the first line and keeps it
       together on any other. */
    .rvfind .annores { margin-left: 0; }
    /* Author, outcome and the controls travel as ONE unit. Left loose they wrapped
       individually, so `resolve` could end up on a line of its own — below the
       agent's full-width report, half a screen from the `raise` it belongs beside. */
    .rvfacts { display: inline-flex; align-items: baseline; gap: 8px; flex: none; margin-left: auto; }
    .prgap { margin: 8px 0; }
    .prgaph { font-size: 12.5px; padding: 3px 0; }
    .prgap.g-covered .prgaph { cursor: pointer; color: var(--dim); }
    .prgap.g-absent .prgaph b { color: #f0a35e; }
    .prlanes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .prlane { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; }
    .prlane b { color: var(--text); }
    .prlane.l-queue { border-color: #2d4a63; }
    .prlane.l-skip { opacity: 0.6; }
    .prempty { padding: 14px; border-top: none; }
    .prempty .dim { margin-top: 6px; max-width: 70ch; }
    .prrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; background: var(--panel); cursor: pointer; }
    .prrow:hover { border-color: var(--accent); }
    .prnum { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 52px; }
    .prtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .prmeta { font-size: 11.5px; white-space: nowrap; }
    .prsize { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
    .pradd { color: #7ee787; } .prdel { color: #f85149; }
    .prswc { font-size: 12.5px; padding: 3px 0; }
    .prswc code { font-family: var(--mono); font-size: 12px; color: #f0a35e; }

    /* --- shared review (web/shared.js) ------------------------------------ */
    /* Tier headings: a rule the eye can stop at, not a box competing with the rows. */
    /* The shared page's toolbar. Its own class rather than `.row`, which is the
       OUTLINE's six-column file grid — borrowing it put `sync` in a 24px column and
       stretched the view toggle across the 1fr. Same mistake as fb1fa20. */
    .sharedbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    /* Links are themed per container here — there is no global `a` rule — so without
       this the peers link renders as the browser's default dark blue on a dark panel. */
    .sharedbar a { margin-left: auto; color: var(--accent); cursor: pointer; text-decoration: none; font-size: 12px; }
    .sharedbar a:hover { text-decoration: underline; }

    .fgroup { margin: 18px 0 4px; padding-bottom: 3px; border-bottom: 1px solid var(--border);
      font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .fgroup:first-of-type { margin-top: 8px; }
    .fgroup.settled { cursor: pointer; user-select: none; }
    .frow { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--panel); }
    .frow.fopen { border-color: var(--dim); }
    .frow .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; cursor: pointer; }
    /* State, severity and marks on one line; the finding itself gets the next one. */
    .fmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; cursor: pointer; }
    .fcaret { color: var(--dim); font-size: 11px; width: 10px; flex: none; }
    .fauthor { margin-left: auto; font-size: 12px; }
    /* WRAPS. This is the submitter-facing sentence on a page that exists to show it;
       it used to share a flex row with the badges and ellipsis away, with nothing to
       click to see the rest. */
    .fcomment { margin: 5px 0 0 18px; color: var(--text); overflow-wrap: anywhere; cursor: pointer; }
    .factions { margin-bottom: 2px; }
    .fdetail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .ftext { white-space: pre-wrap; color: var(--dim); font-family: var(--mono); font-size: 12px; }
    .corr, .tcomment { font-size: 12px; }
    /* A contest is the one thing on this page that must not be skimmed past. */
    .contest { border: 1px solid var(--warn); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .sharednotes { margin: 10px 0; }
    .snote { border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; }
    .composer { display: flex; gap: 6px; align-items: flex-start; }
    .composer textarea { flex: 1; min-height: 52px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 12px; resize: vertical; }
    /* An outstanding ask is the thing a person opened this page to answer. */
    .askbox { border: 1px solid var(--accent); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .prbadge.needsack { border-color: var(--accent); color: var(--accent); }
    .prbadge.contested { border-color: var(--warn); color: var(--warn); }
    .prbadge.ok { border-color: var(--accent2); color: var(--accent2); }
    .prbadge.warnb { border-color: var(--warn); color: var(--warn); }
    /* The index is baselined on a branch other than the one checked out. Loud:
       it changes what every other number on the page means. */
    .checkout-banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 4px;
                       padding: 10px 14px; margin: 10px 16px; font-size: 13px; line-height: 1.5; }
    .checkout-banner b { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; margin-right: 8px; }
    .checkout-banner code { color: var(--fg); }
    .checkout-banner button { margin-left: 10px; }
    /* A scope that may not be answered from. Loud on purpose: the rows below it
       are still rendered, so nothing else on the page says they are not the truth. */
    .blocked { border: 1px solid var(--warn); color: var(--warn); border-radius: 4px;
               padding: 10px 12px; margin: 10px 0; font-size: 13px; }
    .blocked b { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
    .blocked code { color: var(--dim); }
    .prbadge.ask { border-color: var(--accent); color: var(--accent); }
    .ok { color: var(--accent2); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  </style>
